<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAVOD</title>
  <meta name="description" content="ZAVOD — Output: ongoing.">

  <meta property="og:title" content="ZAVOD">
  <meta property="og:description" content="Output: ongoing.">
  <meta property="og:image" content="https://highneken.github.io/zavod-site/images/skilltree.png">

  <meta name="twitter:image" content="https://highneken.github.io/zavod-site/images/skilltree.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

  <!-- ===== GATE: Chrome offline page (dark) ===== -->
  <div id="gate">
    <div class="gate-content">
      <div class="gate-dino-area">
        <div class="gate-dino-static">
          <img src="dino-images/100-percent/100-offline-sprite.png" class="gate-dino-img" alt="">
        </div>
        <div class="dino-wrapper">
          <div class="interstitial-wrapper"></div>
        </div>
      </div>

      <h1 class="gate-title">Press space to start the game</h1>

      <p class="gate-sub">Try the following:</p>
      <ul class="gate-list">
        <li>Check network cables, modem, and router</li>
        <li>Reconnect to Wi-Fi</li>
      </ul>

      <p class="gate-code">ERR_OUTPUT_ONGOING</p>

      <div id="offline-resources">
        <img id="offline-resources-1x" src="dino-images/100-percent/100-offline-sprite.png">
        <img id="offline-resources-2x" src="dino-images/200-percent/200-offline-sprite.png">
        <div id="audio-resources"></div>
      </div>
    </div>
  </div>

  <!-- ===== MAIN SITE (hidden until unlocked) ===== -->
  <div id="site" class="site-hidden">
    <header>
      <h1>ZAVOD</h1>
      <p class="tagline">Output: ongoing<span class="cursor">.</span></p>
    </header>

    <main>
      <div class="grid">
        <figure class="work">
          <video src="images/skilltree.mp4" autoplay loop muted playsinline poster="images/skilltree.png"></video>
          <figcaption class="overlay"><span>Skilltree.</span></figcaption>
        </figure>
        <figure class="work">
          <video src="images/savanna.mp4" autoplay loop muted playsinline poster="images/savanna.png"></video>
          <figcaption class="overlay"><span>It Was All A Dream.</span></figcaption>
        </figure>
      </div>
    </main>

    <footer>
      <p class="location">2026.</p>
      <a href="https://x.com/byZavod" target="_blank" rel="noopener" class="x-link">
        <svg class="x-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @byZavod
      </a>
    </footer>

    <div id="psycho" aria-hidden="true"></div>
  </div>

  <script src="trex-runner.js"></script>
  <script>
    (function () {
      var STORAGE_KEY = 'zavod_unlocked';

      if (localStorage.getItem(STORAGE_KEY)) {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('site').classList.remove('site-hidden');
        return;
      }

      // Show game canvas, hide only the static dino, keep text
      var gameStarted = false;
      var runner = null;
      var dinoStatic = document.querySelector('.gate-dino-static');
      var wrapper = document.querySelector('.interstitial-wrapper');

      function showGame() {
        if (gameStarted) return;
        gameStarted = true;
        // Hide static dino, show game canvas in same spot
        dinoStatic.style.display = 'none';
        wrapper.style.display = 'block';
      }

      // Init runner but hide canvas
      wrapper.style.display = 'none';
      runner = new Runner('.interstitial-wrapper');

      // First input shows the game and triggers Runner
      function onFirstInput(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        e.preventDefault();
        showGame();
        document.removeEventListener('keydown', onFirstInput);
        document.removeEventListener('touchstart', onFirstInput);
        // Let DOM layout the canvas, then resize + trigger Runner
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            runner.adjustDimensions();
            runner.onKeyDown({ keyCode: 32, type: 'keydown', preventDefault: function(){}, target: runner.containerEl });
          });
        });
      }
      document.addEventListener('keydown', onFirstInput);
      document.addEventListener('touchstart', onFirstInput);

      // Restart on tap anywhere when crashed
      document.addEventListener('touchstart', function(e) {
        if (gameStarted && runner && runner.crashed) {
          e.preventDefault();
          runner.restart();
        }
      });

      document.addEventListener('zavod-unlock', function () {
        localStorage.setItem(STORAGE_KEY, '1');

        var gate = document.getElementById('gate');
        var site = document.getElementById('site');
        var tagline = site.querySelector('.tagline');

        setTimeout(function () {
          gate.style.transition = 'background 2s ease, color 2s ease';
          gate.style.background = '#000';
          gate.querySelector('.gate-content').style.transition = 'opacity 1.5s ease';
          gate.querySelector('.gate-content').style.opacity = '0';

          setTimeout(function () {
            setTimeout(function () {
              gate.style.display = 'none';
              if (tagline) tagline.style.opacity = '0';
              site.classList.remove('site-hidden');
              site.style.opacity = '0';
              site.style.transition = 'opacity 2s ease';

              requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                  site.style.opacity = '1';
                  if (tagline) {
                    tagline.style.transition = 'opacity 1.5s ease';
                    setTimeout(function () {
                      tagline.style.opacity = '1';
                    }, 500);
                  }
                });
              });
            }, 500);
          }, 2000);
        }, 1000);
      });
    })();
  </script>
  <script src="psycho.js"></script>
</body>
</html>
