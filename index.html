<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAVOD</title>
  <meta name="description" content="ZAVOD — Output: ongoing.">

  <!-- OG / Social -->
  <meta property="og:title" content="ZAVOD">
  <meta property="og:description" content="Output: ongoing.">
  <meta property="og:image" content="https://highneken.github.io/zavod-site/images/skilltree.png">
  <meta property="og:url" content="https://highneken.github.io/zavod-site/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@byZavod">
  <meta name="twitter:title" content="ZAVOD">
  <meta name="twitter:description" content="Output: ongoing.">
  <meta name="twitter:image" content="https://highneken.github.io/zavod-site/images/skilltree.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="trex-runner.css">

  <!-- // You looked. The factory remembers. -->
</head>
<body>

  <!-- ===== GATE: Chrome offline page (dark) ===== -->
  <div id="gate">
    <div class="gate-content">
      <div class="gate-dino-area">
        <div class="gate-dino-static">
          <img src="dino-images/100-percent/100-offline-sprite.png" class="gate-dino-img" alt="">
        </div>
        <div class="dino-wrapper">
          <div class="interstitial-wrapper"></div>
        </div>
      </div>

      <h1 class="gate-title">Press space to start the game</h1>

      <p class="gate-sub">Try the following:</p>
      <ul class="gate-list">
        <li>Check network cables, modem, and router</li>
        <li>Reconnect to Wi-Fi</li>
      </ul>

      <p class="gate-code">ERR_OUTPUT_ONGOING</p>

      <div id="offline-resources">
        <img id="offline-resources-1x" src="dino-images/100-percent/100-offline-sprite.png">
        <img id="offline-resources-2x" src="dino-images/200-percent/200-offline-sprite.png">
        <div id="audio-resources"></div>
      </div>
    </div>
  </div>

  <!-- ===== TRANSITION: "The scoreboard was never the point." ===== -->
  <div id="transition" class="hidden">
    <p class="transition-text">The scoreboard was never the point.</p>
  </div>

  <!-- ===== RETRO MENU ===== -->
  <div id="menu" class="hidden">
    <div class="menu-content">
      <h1 class="menu-title">ZAVOD</h1>
      <p class="menu-tagline">Output: ongoing<span class="cursor">.</span></p>

      <div class="menu-psycho" id="menu-psycho"></div>

      <nav class="menu-nav">
        <div class="menu-item active" data-action="newgame"><span class="menu-cursor">&gt;</span> NEW GAME</div>
        <div class="menu-item" data-action="continue"><span class="menu-cursor">&gt;</span> CONTINUE</div>
      </nav>
    </div>

    <footer class="retro-footer">
      <p class="footer-year">2026.</p>
      <a href="https://x.com/byZavod" target="_blank" rel="noopener" class="footer-x">
        <svg class="footer-x-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @byZavod
      </a>
    </footer>
  </div>

  <!-- ===== MANIFEST ===== -->
  <div id="manifest" class="hidden">
    <div class="manifest-content">
      <div class="manifest-text" id="manifest-text"></div>
      <p class="manifest-prompt hidden" id="manifest-prompt">PRESS ANY KEY</p>
    </div>
  </div>

  <!-- ===== WORKS ===== -->
  <div id="works" class="hidden">
    <div class="works-nav">
      <a href="#" class="works-back" id="works-back">&#8592; BACK</a>
    </div>

    <div class="works-grid">
      <figure class="work-item" data-title="Skilltree.">
        <div class="work-pixel-wrap">
          <img src="images/skilltree.png" class="work-pixel" alt="Skilltree">
          <video src="images/skilltree.mp4" autoplay loop muted playsinline poster="images/skilltree.png" class="work-hd"></video>
        </div>
        <figcaption class="work-title">Skilltree.</figcaption>
      </figure>

      <figure class="work-item" data-title="It Was All A Dream.">
        <div class="work-pixel-wrap">
          <img src="images/savanna-pixel.png" class="work-pixel" alt="It Was All A Dream">
          <video src="images/savanna.mp4" autoplay loop muted playsinline poster="images/savanna.png" class="work-hd"></video>
        </div>
        <figcaption class="work-title">It Was All A Dream.</figcaption>
      </figure>
    </div>

    <footer class="retro-footer">
      <p class="footer-year">2026.</p>
      <a href="https://x.com/byZavod" target="_blank" rel="noopener" class="footer-x">
        <svg class="footer-x-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @byZavod
      </a>
    </footer>
  </div>

  <script src="trex-runner.js"></script>
  <script src="psycho.js"></script>
  <script>
    (function () {
      var STORAGE_KEY = 'zavod_unlocked';
      var gateEl = document.getElementById('gate');
      var transitionEl = document.getElementById('transition');
      var menuEl = document.getElementById('menu');
      var manifestEl = document.getElementById('manifest');
      var worksEl = document.getElementById('works');

      // ── Sections helper ──
      function showSection(el) {
        [gateEl, transitionEl, menuEl, manifestEl, worksEl].forEach(function(s) {
          s.classList.add('hidden');
        });
        el.classList.remove('hidden');
      }

      // ── Skip gate via ?skip or already unlocked ──
      if (window.location.search.indexOf('skip') > -1) {
        localStorage.setItem(STORAGE_KEY, '1');
      }
      if (localStorage.getItem(STORAGE_KEY)) {
        showSection(menuEl);
        initMenu();
        return;
      }

      // ── Dino Game Init ──
      var gameStarted = false;
      var runner = null;
      var dinoStatic = document.querySelector('.gate-dino-static');
      var wrapper = document.querySelector('.interstitial-wrapper');
      var dinoArea = document.querySelector('.gate-dino-area');

      wrapper.style.position = 'absolute';
      wrapper.style.opacity = '0';
      wrapper.style.pointerEvents = 'none';
      wrapper.style.display = 'block';

      runner = new Runner('.interstitial-wrapper');

      function showGame() {
        if (gameStarted) return;
        gameStarted = true;
        dinoStatic.style.display = 'none';
        wrapper.style.position = '';
        wrapper.style.opacity = '1';
        wrapper.style.pointerEvents = '';
      }

      function onFirstInput(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        e.preventDefault();
        showGame();
        document.removeEventListener('keydown', onFirstInput);
        document.removeEventListener('touchstart', onFirstInput);
        // Recalculate dimensions now that wrapper is visible with correct width
        runner.adjustDimensions();
        runner.handleEvent({ type: Runner.events.TOUCHSTART, keyCode: 32, preventDefault: function(){}, target: runner.containerEl });
      }
      document.addEventListener('keydown', onFirstInput);
      document.addEventListener('touchstart', onFirstInput);

      // ── Unlock transition ──
      document.addEventListener('zavod-unlock', function () {
        localStorage.setItem(STORAGE_KEY, '1');

        // 1s pause
        setTimeout(function () {
          // Fade gate to black
          gateEl.style.transition = 'opacity 2s ease';
          gateEl.style.opacity = '0';

          setTimeout(function () {
            gateEl.classList.add('hidden');
            // Show transition text
            showSection(transitionEl);
            transitionEl.style.opacity = '0';
            requestAnimationFrame(function () {
              transitionEl.style.transition = 'opacity 1s ease';
              transitionEl.style.opacity = '1';
            });

            // Hold for 2s, then fade out
            setTimeout(function () {
              transitionEl.style.transition = 'opacity 1s ease';
              transitionEl.style.opacity = '0';

              setTimeout(function () {
                showSection(menuEl);
                menuEl.style.opacity = '0';
                requestAnimationFrame(function () {
                  menuEl.style.transition = 'opacity 1s ease';
                  menuEl.style.opacity = '1';
                });
                initMenu();
              }, 1000);
            }, 2000);
          }, 2000);
        }, 1000);
      });

      // ── Menu Logic ──
      function initMenu() {
        var items = document.querySelectorAll('.menu-item');
        var activeIndex = 0;

        function setActive(idx) {
          items.forEach(function(item, i) {
            item.classList.toggle('active', i === idx);
          });
          activeIndex = idx;
        }

        function selectItem() {
          var action = items[activeIndex].getAttribute('data-action');
          if (action === 'newgame') {
            showManifest();
          } else if (action === 'continue') {
            showWorks();
          }
        }

        // Keyboard
        document.addEventListener('keydown', function menuKeys(e) {
          if (menuEl.classList.contains('hidden')) return;
          if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            setActive(activeIndex > 0 ? activeIndex - 1 : items.length - 1);
          } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            setActive(activeIndex < items.length - 1 ? activeIndex + 1 : 0);
          } else if (e.key === 'Enter') {
            e.preventDefault();
            selectItem();
          }
        });

        // Mouse/touch
        items.forEach(function(item, i) {
          item.addEventListener('mouseenter', function() { setActive(i); });
          item.addEventListener('click', function(e) {
            e.preventDefault();
            setActive(i);
            selectItem();
          });
        });

        // Psycho Mantis
        if (typeof initPsychoMantis === 'function') {
          initPsychoMantis();
        }
      }

      // ── Manifest ──
      var manifestLines = [
        'You spawned into a game no one explained.',
        '',
        'You learned the rules anyway. Played. Died. Respawned. Kept going.',
        '',
        'The game never ends. It just changes levels.',
        '',
        'Some ask why.',
        'You ask how.',
        '',
        'One watches. One plays.',
        '',
        'The score was never the point.'
      ];

      function showManifest() {
        menuEl.style.transition = 'opacity 0.8s ease';
        menuEl.style.opacity = '0';

        setTimeout(function () {
          showSection(manifestEl);
          manifestEl.style.opacity = '0';
          requestAnimationFrame(function () {
            manifestEl.style.transition = 'opacity 1s ease';
            manifestEl.style.opacity = '1';
          });
          typeManifest();
        }, 800);
      }

      function typeManifest() {
        var textEl = document.getElementById('manifest-text');
        var promptEl = document.getElementById('manifest-prompt');
        textEl.innerHTML = '';
        promptEl.classList.add('hidden');

        var lineIdx = 0;
        var charIdx = 0;
        var currentSpan = null;

        function typeLine() {
          if (lineIdx >= manifestLines.length) {
            // Done typing — show prompt after 2s
            setTimeout(function () {
              promptEl.classList.remove('hidden');
              // Listen for any key/click to go back
              function goBack(e) {
                e.preventDefault();
                document.removeEventListener('keydown', goBack);
                document.removeEventListener('click', goBack);
                document.removeEventListener('touchstart', goBack);
                manifestEl.style.transition = 'opacity 0.8s ease';
                manifestEl.style.opacity = '0';
                setTimeout(function () {
                  showSection(menuEl);
                  menuEl.style.opacity = '0';
                  requestAnimationFrame(function () {
                    menuEl.style.transition = 'opacity 0.5s ease';
                    menuEl.style.opacity = '1';
                  });
                  if (typeof initPsychoMantis === 'function') {
                    initPsychoMantis();
                  }
                }, 800);
              }
              document.addEventListener('keydown', goBack);
              document.addEventListener('click', goBack);
              document.addEventListener('touchstart', goBack);
            }, 2000);
            return;
          }

          var line = manifestLines[lineIdx];
          if (line === '') {
            textEl.appendChild(document.createElement('br'));
            lineIdx++;
            charIdx = 0;
            setTimeout(typeLine, 300);
            return;
          }

          if (charIdx === 0) {
            currentSpan = document.createElement('span');
            currentSpan.className = 'manifest-line';
            textEl.appendChild(currentSpan);
          }

          if (charIdx < line.length) {
            currentSpan.textContent += line[charIdx];
            charIdx++;
            setTimeout(typeLine, 50);
          } else {
            textEl.appendChild(document.createElement('br'));
            lineIdx++;
            charIdx = 0;
            setTimeout(typeLine, 400);
          }
        }

        setTimeout(typeLine, 500);
      }

      // ── Works ──
      function showWorks() {
        menuEl.style.transition = 'opacity 0.8s ease';
        menuEl.style.opacity = '0';

        setTimeout(function () {
          showSection(worksEl);
          worksEl.style.opacity = '0';
          requestAnimationFrame(function () {
            worksEl.style.transition = 'opacity 1s ease';
            worksEl.style.opacity = '1';
          });
          initWorks();
        }, 800);
      }

      function initWorks() {
        // Back button
        document.getElementById('works-back').addEventListener('click', function(e) {
          e.preventDefault();
          goToMenu();
        });

        // ESC to go back
        document.addEventListener('keydown', function worksEsc(e) {
          if (worksEl.classList.contains('hidden')) return;
          if (e.key === 'Escape') {
            e.preventDefault();
            goToMenu();
          }
        });

        // Pixel → HD on hover/tap
        var workItems = document.querySelectorAll('.work-item');
        workItems.forEach(function(item) {
          item.addEventListener('mouseenter', function() {
            item.classList.add('revealed');
          });
          item.addEventListener('click', function() {
            item.classList.add('revealed');
          });
        });
      }

      function goToMenu() {
        worksEl.style.transition = 'opacity 0.8s ease';
        worksEl.style.opacity = '0';
        setTimeout(function () {
          showSection(menuEl);
          menuEl.style.opacity = '0';
          requestAnimationFrame(function () {
            menuEl.style.transition = 'opacity 0.5s ease';
            menuEl.style.opacity = '1';
          });
          if (typeof initPsychoMantis === 'function') {
            initPsychoMantis();
          }
        }, 800);
      }

    })();
  </script>
</body>
</html>
