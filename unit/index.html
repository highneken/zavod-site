<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>—</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 40px;
    }

    .glyph {
      font-family: monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #1c1c1c;
      text-align: center;
      letter-spacing: 3px;
      user-select: none;
    }

    .block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }

    .line {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: #1e1e1e;
      letter-spacing: 2px;
    }

    .line.dim { color: #141414; }

    .id {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: #282828;
      letter-spacing: 4px;
    }

    a {
      font-family: 'Courier New', monospace;
      font-size: 8px;
      color: #161616;
      letter-spacing: 3px;
      text-decoration: none;
      border-bottom: 1px solid #161616;
      padding-bottom: 1px;
    }
  </style>
</head>
<body>

  <div class="glyph">△<br>△ △</div>

  <div class="block">
    <div class="line">ref: 0x1A4F</div>
    <div class="line">status: open</div>
    <div class="line dim">last_index: 2026-01-08</div>
    <div class="line dim">next: —</div>
  </div>

  <div class="id" id="uid"></div>

  <a href="/">←</a>

  <script>
    var ts = Date.now().toString(36).toUpperCase();
    var r = Math.random().toString(36).substring(2,5).toUpperCase();
    document.getElementById('uid').textContent = ts + '-' + r;
  </script>
</body>
</html>
