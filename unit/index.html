<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNIT IDENTIFIED</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #333;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 32px;
    }

    .triforce {
      font-size: 14px;
      line-height: 1.3;
      color: #2a2a2a;
      text-align: center;
      letter-spacing: 2px;
    }

    .unit-id {
      font-size: 10px;
      letter-spacing: 4px;
      color: #1f1f1f;
      text-transform: uppercase;
    }

    .label {
      font-size: 9px;
      letter-spacing: 6px;
      color: #1a1a1a;
      text-transform: uppercase;
    }

    .message {
      font-size: 11px;
      color: #2d2d2d;
      letter-spacing: 1px;
      max-width: 320px;
      text-align: center;
      line-height: 1.8;
    }

    .back {
      font-size: 9px;
      letter-spacing: 3px;
      color: #1a1a1a;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 2px;
      transition: color 0.3s, border-color 0.3s;
    }
    .back:hover { color: #444; border-color: #444; }
  </style>
</head>
<body>
  <div class="triforce">
    &nbsp;&nbsp;&nbsp;△<br>
    &nbsp;&nbsp;△&nbsp;△
  </div>

  <div class="label">UNIT IDENTIFIED</div>

  <div class="unit-id" id="uid">—</div>

  <div class="message">
    You were not supposed to find this.<br>
    But you did.<br>
    That means something.
  </div>

  <a href="/" class="back">← return to system</a>

  <script>
    var ts = Date.now().toString(36).toUpperCase();
    var rand = Math.random().toString(36).substring(2,6).toUpperCase();
    document.getElementById('uid').textContent = 'UNIT-' + ts + '-' + rand;
  </script>
</body>
</html>
